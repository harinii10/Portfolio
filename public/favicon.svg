<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9B5CFF" />
      <stop offset="100%" stop-color="#5B8CFF" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#9B5CFF" flood-opacity="0.5"/>
    </filter>
  </defs>
  <rect width="100" height="100" rx="24" fill="#0B0B0F"/>
  <rect x="2" y="2" width="96" height="96" rx="22" stroke="url(#grad1)" stroke-width="2" stroke-opacity="0.6"/>
  <!-- Modern stylized H monogram -->
  <path d="M30 25 V75 M70 25 V75 M30 50 H70" 
        stroke="url(#grad1)" 
        stroke-width="10" 
        stroke-linecap="round" 
        stroke-linejoin="round"
        filter="url(#glow)"/>
  <circle cx="50" cy="50" r="4" fill="#FFFFFF"/>
</svg>
